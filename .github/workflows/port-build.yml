# =============================================================================
# Mihon x SmartOS 移植分支（port/smartos）专用 CI
# -----------------------------------------------------------------------------
# 用途：只做「能编译 + 能出可安装 APK」的快速验证，不做发布、不碰正式签名。
#   1) 先跑 assembleRelease —— 移植代码的 API 不匹配/编译错误在这里最快暴露；
#   2) 单测与 SQLDelight 迁移校验只产出报告，continue-on-error，不阻塞出包；
#   3) 上传 APK 与单测报告，供本机无 JDK/Android SDK 的开发者下载验证。
#
# 本文件为新增文件，不覆盖上游已有的 .github/workflows/{build,release,update_website}.yml。
#
# SDK / 工具链版本来源：
#   gradle/mihon.versions.toml
#     android-sdk-compile = "37.2"         -> platforms;android-37.2（minor SDK，需 AGP 9.x 支持）
#     android-sdk-target  = "36"
#     android-ndk         = "29.0.14206865" -> ndk;29.0.14206865（build-logic 对每个 android 模块设了 ndkVersion）
#     java                = "17"           -> 仅 source/target 兼容级别（tapmoc configureJavaCompatibility），
#                                             构建 JVM 用 JDK 21（与上游 .github/.java-version 一致）
#   gradle/wrapper/gradle-wrapper.properties -> Gradle 9.8.1
#   gradle/libs.versions.toml               -> AGP 9.4.1
#   build-tools：仓库未显式指定 buildToolsVersion，由 AGP 9.4.1 自行选择默认版本
#                （37.0.0 是否存在取决于 SDK 仓库，见安装步骤里的注释）。
#
# 签名说明（重要）：
#   app/build.gradle.kts 中 release 变体固定 signingConfig = debug.signingConfig；
#   只有当环境变量 MIHON_GITHUB_RELEASE=true 时才会去读
#   storeFile / storePassword / keyAlias / keyPassword 这些 secrets。
#   本流水线**故意不设置** MIHON_GITHUB_RELEASE，也不放 keystore.properties，
#   因此产出的是「debug 签名的 release 包」：可直接安装，无需任何 secrets。
#   注意其签名与官方 Mihon 不同，不能覆盖安装官方包；applicationId 保持 app.mihon。
# =============================================================================

name: Port Build (SmartOS)

on:
  # 任意分支的 push 都触发（移植分支开发用）
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

# 同一分支 / 同一 PR 只保留最新一次运行，避免排队浪费 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Test (port/smartos)
    # 与上游 .github/workflows/build.yml 保持一致
    runs-on: ubuntu-26.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 浅克隆仓库（本仓库只有少量提交）也能工作。
          # 注意：上游 build.gradle.kts 用 `git rev-list --count HEAD` 生成 COMMIT_COUNT，
          # 浅克隆下只会得到 1（只影响 BuildConfig.COMMIT_COUNT 与 unstable 变体的
          # versionName 后缀，不影响 release 的 versionCode=38 / versionName=0.21.2）。
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        # 注意：不用 android-actions/setup-android@v3 —— 它会去装已废弃的 tools 包，
        # 在 2026 年的 runner 镜像上直接 exit 1（首次 CI 就是死在这里）。
        # ubuntu-26.04 镜像已预装 cmdline-tools 与 sdkmanager，直接用它安装 + 接受许可即可。
        shell: bash
        run: |
          set -uo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n 1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$SDKMANAGER" --version || true

          # 接受所有许可（AGP 自动下载缺失组件时必需）
          timeout 600 bash -c "yes | '$SDKMANAGER' --licenses" > /dev/null 2>&1 \
            || echo "::warning::sdkmanager --licenses 退出码非 0（通常可忽略）"

          install_component() {
            pkg="$1"
            if "$SDKMANAGER" --install "$pkg" > /tmp/sdkmanager-install.log 2>&1; then
              echo "installed: $pkg"
              return 0
            fi
            if "$SDKMANAGER" --channel=3 --install "$pkg" > /tmp/sdkmanager-install.log 2>&1; then
              echo "installed: $pkg (canary channel)"
              return 0
            fi
            echo "::warning::sdkmanager 安装 '$pkg' 失败，交由 AGP 9.4.1 构建时自动下载；日志末尾："
            tail -n 15 /tmp/sdkmanager-install.log || true
            return 1
          }

          # compileSdk 37.2（minor SDK）是硬依赖；ndkVersion 由 build-logic 对所有 android 模块设置
          install_component "platforms;android-37.2" || true
          install_component "platform-tools" || true
          install_component "ndk;29.0.14206865" || true

          echo "--- platforms ---"; ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          echo "--- ndk ---"; ls "$ANDROID_HOME/ndk" 2>/dev/null || true

          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # 分支/PR 间共享 Gradle 缓存（含 wrapper 发行版与构建缓存）。
          # 上游用 v6 + cache-encryption-key secret；此处不引入 secret，保持 fork 可直接跑。
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Assemble release APK
        id: build
        # 先编译：移植代码的签名/API 不匹配会在这里最快暴露。
        # -Pdist=ci -> includeTelemetry=true（仓库已跟踪 app/google-services.json，无需 secrets）
        #            -> enableUpdater=true
        #            且不触发 MIHON_GITHUB_RELEASE 分支（= 使用 debug 签名）
        run: ./gradlew --no-daemon assembleRelease -Pdist=ci

      - name: Verify model asset integrity
        # .gitattributes 的 `* text eol=lf` 会把 *.onnx 当文本归一化（丢掉 41 个 CR 字节），
        # 导致 ONNX Runtime 报 ORT_INVALID_PROTOBUF。这里在 CI 上做一次字节级校对。
        shell: bash
        run: |
          python3 - <<'EOF'
          import hashlib, zipfile, glob, sys
          src = 'app/src/main/assets/text_enhancement/ppocrv5_mobile_det.onnx'
          want = hashlib.sha256(open(src, 'rb').read()).hexdigest()
          apks = glob.glob('app/build/outputs/apk/release/*arm64-v8a*.apk')
          if not apks:
              print('::error::arm64 APK not found'); sys.exit(1)
          got = hashlib.sha256(zipfile.ZipFile(apks[0]).read('assets/text_enhancement/ppocrv5_mobile_det.onnx')).hexdigest()
          print('source:', want)
          print('apk   :', got)
          if want != got:
              print('::error::model asset was altered during packaging')
              sys.exit(1)
          EOF

      - name: Run unit tests
        id: unit_tests
        # 单测失败不阻塞出包，但会在 summary 与报告 artifact 里可见
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Verify SQLDelight migrations
        id: sqldelight
        continue-on-error: true
        run: ./gradlew --no-daemon verifySqlDelightMigration

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: mihon-smartos-apk
          # ABI splits + universal APK（app/build.gradle.kts 里 splits.abi 开启）
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mihon-smartos-unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14

      - name: Publish arm64 APK to a rolling release
        # artifact 包是 5 个 ABI 打包的 219 MB zip，手机上根本没法下；
        # 这里把 arm64 单包（~60 MB）挂到 port-latest 这个滚动 Release 上，手机直接点链接下载。
        if: github.ref == 'refs/heads/port/smartos'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: port-latest
          name: Port build (latest)
          body: |
            自动构建：分支 port/smartos @ ${{ github.sha }}

            - 适用：arm64-v8a（iReader SmartOS 4+ / 现代 Android 设备）
            - 签名：debug（不可覆盖官方 Mihon）
            - 包含：水波纹翻页、图像调整、文字增强、章节构建、分页阅读增强
          files: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Port build (SmartOS) summary"
            echo ""
            echo "| step | outcome |"
            echo "| --- | --- |"
            echo "| assembleRelease | ${{ steps.build.outcome }} |"
            echo "| testDebugUnitTest | ${{ steps.unit_tests.outcome }} |"
            echo "| verifySqlDelightMigration | ${{ steps.sqldelight.outcome }} |"
            echo ""
            echo "签名：debug（未设置 MIHON_GITHUB_RELEASE），可安装但不可覆盖官方包。"
          } >> "$GITHUB_STEP_SUMMARY"
